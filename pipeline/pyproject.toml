[project]
name = "veeduria"
version = "0.1.0"
description = "Pipeline de la veeduría de contratación de la Alcaldía de Medellín"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "ftfy>=6.3.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
]

[project.scripts]
veeduria = "veeduria.cli:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: usa la red; se excluye por defecto (uv run pytest -m network)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
