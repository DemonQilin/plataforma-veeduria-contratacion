# Catálogo de secretarías (R8; docs/reglas.md; ADR 0030).
#
# MEData · Ejecución abrevia los nombres («Gest Hum yServ Ciu») y SECOP II usa la unidad
# del proceso («Secretaria Gestión Humana»), con variantes entre años. Cada texto se compara
# sin mayúsculas, tildes ni espacios (`catalog_key`), así que solo se listan las formas que
# difieren más allá de eso. Un texto que no esté aquí no se asigna y queda en el reporte de
# calidad; `unassigned` es el resultado de R8 cuando ninguna fuente aporta una secretaría.
#
# Equivalencias que no son obvias por el nombre (ADR 0030): «De la No Violencia» (MEData) y
# «Secretaria de Paz y Derechos Humanos» (SECOP II); «Gest y ContrTerrit» y «Secretaria
# Gestión y Control»; «Gobierno y GestGab» y «Secretaría de Gobierno»; «Gest Hum yServ Ciu» y
# «Secretaria Gestión Humana». «Buen Comienzo» es un programa que las dos fuentes usan como
# unidad.

